<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

   <title>Temperature Monitoring</title>
<style>
.button {
  background-color: Tomato;
  border: none;
  color: black;
  padding: 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
.button1 {border-radius: 12px;}
input[type=text], select, textarea {
  width: 25%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  resize: vertical;
}

label {
  padding: 12px 12px 12px 0;
  display: inline-block;
}
input[type=submit] {
  background-color: Tomato;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  float: center;
}
h1 {
  background-color: Tomato;
  opacity: 0.3;
}
p.solid {border-style: solid; color: Tomato;}
</style>
</head>
<script>
   getData();
   async function getData() {
      const response = await fetch('./data_file.json');
      const data = await response.json();
      console.log(data);
      length = data.length;
      console.log(length);
      labels = [];
      values = [];
      switches = [];
      heaters = [];
      flag = [];

      for (i = 0; i < length; i++) {
         values.push(data[i].Temp);
         labels.push(data[i].time_stamp);
         switches.push(data[i].Fan);
         heaters.push(data[i].Heater);
         flag.push(data[i].Flag);

      }

      var my1Chart = new Chart("my1Chart", {
         type: "line",
         data: {
            labels: labels,
            datasets: [
               {

                  backgroundColor: "Tomato",
                  data: switches
               }
            ]
         },
         options: {

            legend: { display: false },
            scales: {
                    yAxes: [{
                            display: true,
                            ticks: {
                                beginAtZero: true,


                            }
                        }]
                },
            title: {
               display: true,
               text: 'Fan state'
            }

         }
      });
      var my3Chart = new Chart("my3Chart", {
         type: "line",
         data: {
            labels: labels,
            datasets: [
               {
                  backgroundColor: "Tomato",
                  data: heaters
               }
            ]
         },
         options: {

            legend: { display: false },
            scales: {
                    yAxes: [{
                            display: true,
                            ticks: {
                                beginAtZero: true,
                            }
                        }]
                },
            title: {
               display: true,
               text: 'Heater state'
            }

         }
      });


      var my2Chart = new Chart("my2Chart", {
         type: "bar",
         data: {
            labels: labels,
            datasets: [
               {

                  backgroundColor: "Tomato",
                  data: values
               }
            ]
         },
         options: {
            legend: { display: false },
            scales: {
                    yAxes: [{
                            display: true,
                            ticks: {
                                beginAtZero: true
                            }
                        }]
                },
            title: {
               display: true,
               text: 'temperature'
            }
         }
      });


   }
</script>

<body>
  <title>dashboard</title>
  <h1>choose state</h1>
  <p class="solid">If you want to show charts insert 1, turn on the fan insert 2
  , turn off the fan insert 3, turn on the heater insert 4 or turn off the heater insert 5</p>
  <form action="http://127.0.0.1:5000/login">
    <div  class="col-25">
       <label>insert number:</label>
    </div>
    <div class="col-75">
       <p><input type="text" name="state" id="state" /></p>
       <input type="submit" value="enter">
    </div>
  </form>
  <h1>choose setpoint</h1>
  <form action="http://127.0.0.1:5000/Setpoint">
    <div  class="col-25">
       <label>insert setpoint:</label>
    </div>
    <div class="col-75">
       <p><input type="text" name="setpoint" id="setpoint" /></p>
       <input type="submit" value="enter">
    </div>
  </form>
  <h1>Monitoring</h1>

<button class="button button1" onclick="getData()" >Press to display our most recent data</button>

   <div style="width: 800, height: 600">
      <canvas id="my1Chart">
      </canvas>
   </div>
  <div style="width: 800, height: 800">
      <canvas id="my3Chart">
      </canvas>
   </div>
   <div style="width: 800, height: 800">
      <canvas id="my2Chart">
      </canvas>
   </div>
</body>
</html>
