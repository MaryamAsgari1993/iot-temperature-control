<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#f3eee4"/>
  <rect x="14" y="14" width="1172" height="752" fill="none" stroke="#1c1915" stroke-width="1.6"/>
  <rect x="20" y="20" width="1160" height="740" fill="none" stroke="#1c1915" stroke-width="0.6"/>
  <text x="48" y="64" font-family="Inter, sans-serif" font-size="13" letter-spacing="2.2" fill="#1d6a72" font-weight="600">FIGURE 03</text>
  <text x="48" y="102" font-family="Noto Serif, Liberation Serif, serif" font-size="34" fill="#1c1915">Control with a delay</text>
  <text x="48" y="132" font-family="Inter, sans-serif" font-size="16" fill="#5c5348">IoT Events waits before it lets the fan or the heater LED change.</text>
  <circle cx="78" cy="192" r="16" fill="#1d6a72"/>
  <text x="78" y="197" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">1</text>
  <text x="108" y="186" font-family="Noto Serif, serif" font-size="20" fill="#1c1915">Read</text><text x="108" y="208" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">Temperature message arrives</text>
  <line x1="78" y1="210" x2="78" y2="250" stroke="#cfc4b4" stroke-width="1.4"/>
  <circle cx="78" cy="290" r="16" fill="#1c1915"/>
  <text x="78" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">2</text>
  <text x="108" y="284" font-family="Noto Serif, serif" font-size="20" fill="#1c1915">Compare</text><text x="108" y="306" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">Against the setpoint</text>
  <line x1="78" y1="308" x2="78" y2="348" stroke="#cfc4b4" stroke-width="1.4"/>
  <circle cx="78" cy="388" r="16" fill="#8d5a16"/>
  <text x="78" y="393" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">3</text>
  <text x="108" y="382" font-family="Noto Serif, serif" font-size="20" fill="#1c1915">Delay</text><text x="108" y="404" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">Hold so it does not chatter</text>
  <rect x="48" y="470" width="200" height="110" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/><rect x="48" y="470" width="200" height="8" rx="4" fill="#1d6a72"/><rect x="48" y="474" width="200" height="4" fill="#1d6a72"/>
  <text x="68" y="512" font-family="Noto Serif, serif" font-size="20" fill="#1c1915">Fan on</text><text x="68" y="538" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">still warmer than</text><text x="68" y="556" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">the setpoint</text>
  <rect x="264" y="470" width="210" height="110" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/><rect x="264" y="470" width="210" height="8" rx="4" fill="#c4622d"/><rect x="264" y="474" width="210" height="4" fill="#c4622d"/>
  <text x="284" y="512" font-family="Noto Serif, serif" font-size="20" fill="#1c1915">Heater LED</text><text x="284" y="538" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">still cooler than</text><text x="284" y="556" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">the setpoint</text>
  <polyline points="78.0,430.0 78.0,450.0 148.0,450.0 148.0,470.0" fill="none" stroke="#1d6a72" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="148.0,470.0 143.4,462.3 152.6,462.3" fill="#1d6a72"/>
  <polyline points="78.0,430.0 78.0,450.0 360.0,450.0 360.0,470.0" fill="none" stroke="#c4622d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="360.0,470.0 355.4,462.3 364.6,462.3" fill="#c4622d"/>
  <rect x="520" y="168" width="632" height="490" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.1"/>
  <text x="544" y="204" font-family="Noto Serif, serif" font-size="20" fill="#1c1915">Illustrative trace</text><text x="544" y="226" font-family="Inter, sans-serif" font-size="13" fill="#5c5348">The fan or the heater LED waits out a delay cycle.</text>
  <line x1="580" y1="270" x2="580" y2="560" stroke="#1c1915" stroke-width="1.2"/>
  <line x1="580" y1="560" x2="1108" y2="560" stroke="#1c1915" stroke-width="1.2"/>
  <text x="572" y="278" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#5c5348">warmer</text>
  <text x="572" y="560" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#5c5348">cooler</text>
  <text x="1108" y="582" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#5c5348">time</text>
  <line x1="580" y1="400" x2="1108" y2="400" stroke="#8d5a16" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1104" y="392" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8d5a16" font-weight="600">setpoint</text>
  <rect x="690" y="270" width="90" height="290" fill="#f3e6cf" opacity="0.85"/>
  <rect x="960" y="270" width="80" height="290" fill="#f3e6cf" opacity="0.85"/>
  <rect x="780" y="542" width="160" height="10" fill="#1d6a72"/>
  <rect x="1040" y="542" width="60" height="10" fill="#c4622d"/>
  <polyline points="600,460 650,430 700,340 760,300 820,292 880,330 940,390 1000,470 1060,450 1090,410" fill="none" stroke="#1c1915" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="700" y="288" font-family="Inter, sans-serif" font-size="11" fill="#8d5a16">delay</text>
  <text x="800" y="534" font-family="Inter, sans-serif" font-size="11" fill="#1d6a72" font-weight="600">fan on</text>
  <text x="968" y="288" font-family="Inter, sans-serif" font-size="11" fill="#8d5a16">delay</text>
  <text x="1036" y="534" font-family="Inter, sans-serif" font-size="11" fill="#c4622d" font-weight="600">LED</text>
  <text x="544" y="598" font-family="Inter, sans-serif" font-size="13" fill="#5c5348"><tspan x="544" dy="0">Shaded bands are the wait.</tspan><tspan x="544" dy="18">The fan or the heater LED changes after that wait,</tspan><tspan x="544" dy="18">while the reading is still past the setpoint.</tspan></text>
  <line x1="28" y1="702" x2="1172" y2="702" stroke="#1c1915" stroke-width="0.8"/>
  <text x="36" y="730" font-family="Inter, Liberation Sans, sans-serif" font-size="13" fill="#1c1915" font-weight="600">Temperature Monitoring and Control System</text>
  <text x="36" y="748" font-family="Inter, Liberation Sans, sans-serif" font-size="12" fill="#5c5348">Maryam Asgari · Concordia University · Fall 2022</text>
  <text x="1164" y="730" text-anchor="end" font-family="Inter, Liberation Sans, sans-serif" font-size="13" fill="#1c1915" font-weight="600">Fig. 03</text>
  <text x="1164" y="748" text-anchor="end" font-family="Inter, Liberation Sans, sans-serif" font-size="12" fill="#5c5348">Control loop</text>
</svg>
