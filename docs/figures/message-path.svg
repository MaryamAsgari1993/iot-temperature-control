<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <rect width="1200" height="740" fill="#f3eee4"/>
  <rect x="14" y="14" width="1172" height="712" fill="none" stroke="#1c1915" stroke-width="1.6"/>
  <rect x="20" y="20" width="1160" height="700" fill="none" stroke="#1c1915" stroke-width="0.6"/>
  <text x="48" y="64" font-family="Inter, sans-serif" font-size="13" letter-spacing="2.2" fill="#1d6a72" font-weight="600">FIGURE 04</text>
  <text x="48" y="102" font-family="Noto Serif, Liberation Serif, serif" font-size="34" fill="#1c1915">One reading, end to end</text>
  <text x="48" y="132" font-family="Inter, sans-serif" font-size="16" fill="#5c5348">Followed with MQTT.fx and the AWS CLI.</text>
  <rect x="48" y="210" width="246" height="360" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/><rect x="48" y="210" width="246" height="8" rx="4" fill="#1d6a72"/><rect x="48" y="214" width="246" height="4" fill="#1d6a72"/>
  <circle cx="80" cy="252" r="14" fill="#1d6a72"/>
  <text x="80" y="257" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">1</text>
  <text x="104" y="258" font-family="Noto Serif, serif" font-size="24" fill="#1c1915">Publish</text>
  <text x="72" y="330" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">ESP32-WROOM reads</text>
  <text x="72" y="362" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">the sensor.</text>
  <text x="72" y="394" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">JSON temperature</text>
  <text x="72" y="426" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">goes out every</text>
  <text x="72" y="458" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">10 seconds.</text>
  <rect x="336" y="210" width="246" height="360" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/><rect x="336" y="210" width="246" height="8" rx="4" fill="#1c1915"/><rect x="336" y="214" width="246" height="4" fill="#1c1915"/>
  <circle cx="368" cy="252" r="14" fill="#1c1915"/>
  <text x="368" y="257" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">2</text>
  <text x="392" y="258" font-family="Noto Serif, serif" font-size="24" fill="#1c1915">Decide</text>
  <text x="360" y="330" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">IoT Core takes it</text>
  <text x="360" y="362" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">over TLS 1.2,</text>
  <text x="360" y="394" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">with an X.509</text>
  <text x="360" y="426" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">certificate.</text>
  <text x="360" y="458" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">IoT Events waits.</text>
  <rect x="624" y="210" width="246" height="360" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/><rect x="624" y="210" width="246" height="8" rx="4" fill="#c4622d"/><rect x="624" y="214" width="246" height="4" fill="#c4622d"/>
  <circle cx="656" cy="252" r="14" fill="#c4622d"/>
  <text x="656" y="257" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">3</text>
  <text x="680" y="258" font-family="Noto Serif, serif" font-size="24" fill="#1c1915">Act</text>
  <text x="648" y="330" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">A control message</text>
  <text x="648" y="362" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">returns.</text>
  <text x="648" y="394" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">The 2N2222 runs</text>
  <text x="648" y="426" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">the fan, or the LED</text>
  <text x="648" y="458" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">shows heater state.</text>
  <rect x="912" y="210" width="246" height="360" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/><rect x="912" y="210" width="246" height="8" rx="4" fill="#2c6b45"/><rect x="912" y="214" width="246" height="4" fill="#2c6b45"/>
  <circle cx="944" cy="252" r="14" fill="#2c6b45"/>
  <text x="944" y="257" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3eee4" font-weight="600">4</text>
  <text x="968" y="258" font-family="Noto Serif, serif" font-size="24" fill="#1c1915">Record</text>
  <text x="936" y="330" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">DynamoDB stores</text>
  <text x="936" y="362" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">the reading.</text>
  <text x="936" y="394" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">SNS can email.</text>
  <text x="936" y="426" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">The dashboards</text>
  <text x="936" y="458" font-family="Inter, sans-serif" font-size="16" fill="#1c1915">plot it.</text>
  <line x1="294.0" y1="390.0" x2="328.0" y2="390.0" stroke="#1c1915" stroke-width="1.7" stroke-linecap="round"/><polygon points="335.0,390.0 327.3,394.6 327.3,385.4" fill="#1c1915"/>
  <line x1="582.0" y1="390.0" x2="616.0" y2="390.0" stroke="#1c1915" stroke-width="1.7" stroke-linecap="round"/><polygon points="623.0,390.0 615.3,394.6 615.3,385.4" fill="#1c1915"/>
  <line x1="870.0" y1="390.0" x2="904.0" y2="390.0" stroke="#1c1915" stroke-width="1.7" stroke-linecap="round"/><polygon points="911.0,390.0 903.3,394.6 903.3,385.4" fill="#1c1915"/>
  <text x="48" y="610" font-family="Inter, sans-serif" font-size="15" fill="#5c5348">The dashboards publish a new setpoint or a manual command back through IoT Core.</text>
  <line x1="28" y1="662" x2="1172" y2="662" stroke="#1c1915" stroke-width="0.8"/>
  <text x="36" y="690" font-family="Inter, Liberation Sans, sans-serif" font-size="13" fill="#1c1915" font-weight="600">Temperature Monitoring and Control System</text>
  <text x="36" y="708" font-family="Inter, Liberation Sans, sans-serif" font-size="12" fill="#5c5348">Maryam Asgari · Concordia University · Fall 2022</text>
  <text x="1164" y="690" text-anchor="end" font-family="Inter, Liberation Sans, sans-serif" font-size="13" fill="#1c1915" font-weight="600">Fig. 04</text>
  <text x="1164" y="708" text-anchor="end" font-family="Inter, Liberation Sans, sans-serif" font-size="12" fill="#5c5348">Message path</text>
</svg>
